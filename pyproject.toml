[project]
name = "wg-sniper"
version = "0.1.0"
description = "Real-time WG-Gesucht listing notifier via IMAP + Telegram"
requires-python = ">=3.11"
dependencies = [
    "aioimaplib>=1.1.0",
    "aiogram>=3.13.0",
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.0",
    "httpx[http2]>=0.27.0",
    "lxml>=5.3.0",
    "psutil>=6.0.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wg_sniper"]
