[project]
name = "wg-sniper"
version = "0.1.0"
description = "Real-time WG-Gesucht listing notifier via IMAP + Telegram"
requires-python = ">=3.11"
dependencies = [
    "aioimaplib>=1.1.0",
    "aiogram>=3.13.0",
    "aiosqlite>=0.20.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wg_sniper"]
